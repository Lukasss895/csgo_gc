name: Build

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'
        vcpkgJsonGlob: 'vcpkg.json'
        vcpkgConfigurationJsonGlob: 'vcpkg-configuration.json'
        doNotCache: true

    - name: Build Windows
      shell: bash
      run: |
        mkdir "$GITHUB_WORKSPACE/release"
        cmake -A Win32 -B "$GITHUB_WORKSPACE/build" -DCMAKE_BUILD_TYPE=Release -S "$GITHUB_WORKSPACE" -DOUTDIR="$GITHUB_WORKSPACE/release" -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET:STRING=x86-windows-static
        cmake --build "$GITHUB_WORKSPACE/build" --config Release --target csgo srcds csgo_gc

    - name: Package
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/release/csgo_gc"
        cp "$GITHUB_WORKSPACE"/examples/*.txt "$GITHUB_WORKSPACE/release/csgo_gc/" || true
        ls -R "$GITHUB_WORKSPACE/release"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: csgo_gc-windows
        path: ${{ github.workspace }}/release
